  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --bg:#100b19; --rose:#f4a6bd; --violet:#ac89e8; --gold:#f3c997; --ember:#ff634b; --ink:#fff3f5; --muted:#c1aec9; --ease:cubic-bezier(.2,.7,.2,1); }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--bg); }
    body { margin:0; overflow-x:hidden; color:var(--ink); font-family:'DM Sans',sans-serif; font-size:16px; -webkit-tap-highlight-color:transparent; background:#08060e; }
    button { font:inherit; cursor:pointer; color:inherit; }
    button:disabled { cursor:default; }
    button:focus-visible, [tabindex="0"]:focus-visible { outline:2px solid var(--gold); outline-offset:7px; }
    h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus { outline:none; }
    h1,h2,p { margin:0; }
    h1,h2 { font-family:'Great Vibes',cursive; font-weight:400; line-height:1.2; text-wrap:balance; }
    h1 { font-size:clamp(3.2rem,6.5vw,5.7rem); }
    h2 { font-size:clamp(3rem,5.5vw,4.8rem); }
    button, a { touch-action:manipulation; }
    [hidden] { display:none !important; }
    .backdrop { position:fixed; inset:0; z-index:0; pointer-events:none; background:radial-gradient(ellipse at 50% 105%,#40244080,transparent 65%),radial-gradient(ellipse at 15% 30%,#30204950,transparent 60%),#0b0813; transition:opacity 1s; opacity:0; }
    body.starry .backdrop { opacity:1; }
    .masthead { position:fixed; top:0; left:0; right:0; z-index:20; display:flex; justify-content:space-between; align-items:center; padding:clamp(18px,3vw,36px) clamp(20px,4.5vw,72px); pointer-events:none; }
    .brand { display:flex; align-items:center; gap:11px; font-size:12px; letter-spacing:.14em; color:#e9d4df; }
    .brand-mark { font-family:serif; color:var(--rose); font-size:23px; }
    .utilities { display:flex; gap:8px; pointer-events:auto; }
    .icon-button { width:42px; height:42px; display:grid; place-items:center; border:1px solid #e8c1f226; border-radius:50%; background:#170e2280; color:#e9cbdc; }
    .icon-button:hover { border-color:#e8c1f280; background:#3f2444; }
    main { position:relative; z-index:2; min-height:100svh; }
    .scene { min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:108px 24px 116px; text-align:center; position:relative; opacity:0; transform:translateY(16px) scale(.98); transition:opacity .65s var(--ease),transform .65s var(--ease); }
    .scene.is-active { opacity:1; transform:none; }
    .scene.is-leaving { opacity:0; transform:scale(1.025); pointer-events:none; }
    .content { width:min(100%,820px); position:relative; }
    .eyebrow { font-size:12px; letter-spacing:.24em; line-height:1.7; font-weight:500; color:var(--rose); margin-bottom:20px; }
    .subline { color:var(--muted); line-height:1.8; margin:20px auto 0; max-width:540px; }
    .primary { min-height:52px; padding:15px 27px; margin-top:30px; border:1px solid #ffcce13d; border-radius:100px; background:linear-gradient(120deg,#c37eac,#9c70bb); box-shadow:0 8px 35px #ac6ec328,inset 0 1px 0 #ffe4f52b; color:#fff; font-size:14px; font-weight:500; transition:transform .2s,box-shadow .2s; }
    .primary:hover { transform:translateY(-3px); box-shadow:0 9px 40px #ac6ec360; }
    .text-button { border:0; background:none; color:var(--rose); min-height:44px; padding:12px 16px; font-size:14px; }
    .footer { position:fixed; bottom:0; left:0; right:0; z-index:15; display:flex; justify-content:space-between; align-items:center; padding:23px clamp(20px,4.5vw,72px); background:linear-gradient(transparent,#08060ef0); pointer-events:none; gap:20px; }
    .dedication { color:#b5a0b9; font-size:12px; }
    .chapter { color:#bba3c0; font-size:11px; letter-spacing:.15em; }
    .progress { display:flex; justify-content:center; gap:8px; margin-top:12px; }
    .progress i { width:4px; height:4px; border-radius:4px; background:#8c6a9859; transition:width .5s,background .5s; }
    .progress i.current { width:22px; background:var(--rose); box-shadow:0 0 10px #f4a6bd80; }
    #intro { background:radial-gradient(ellipse at 70% 85%,#b24c9670,transparent 58%),radial-gradient(ellipse at 25% 45%,#6734a685,transparent 65%),linear-gradient(155deg,#100b23,#291336 70%,#49223f); }
    #intro h1 { font-size:clamp(2.7rem,5.5vw,4.7rem); max-width:790px; margin:auto; }
    .clock-card { width:fit-content; max-width:100%; padding:30px clamp(17px,5vw,55px) 24px; margin:38px auto 24px; border:1px solid #e7b1fb38; border-radius:24px; background:linear-gradient(130deg,#f8c1ff12,#ffffff04); box-shadow:0 0 85px #cb73e62c,inset 0 0 28px #e098ff0a; backdrop-filter:blur(15px); }
    .clock { display:flex; align-items:center; gap:clamp(9px,2.6vw,25px); font-size:clamp(2.8rem,8.8vw,6.5rem); font-weight:400; letter-spacing:.02em; font-variant-numeric:tabular-nums; color:#ffe9ff; text-shadow:0 0 22px #f3b7ff70; line-height:1; }
    .clock b { font:inherit; }
    .clock em { font-style:normal; font-weight:400; color:#c394d2; font-size:.62em; padding-bottom:8px; }
    .time-units { display:flex; justify-content:space-between; margin-top:20px; font-size:10px; letter-spacing:.19em; color:#d7aedf; }
    .time-units span { width:28%; }
    .pulse { animation:pulse 2.3s ease-in-out infinite; color:#e7c4e6; font-size:14px; }
    #heart { background:#000; overflow:hidden; }
    #heart .content { width:min(100%,1000px); }
    #heart .eyebrow { color:#cf8e85; }
    #heart h1 { font-size:clamp(2.8rem,5vw,4.3rem); color:#ffe7df; }
    .heart-button { display:block; position:relative; width:min(900px,100%); height:clamp(185px,calc(100svh - 365px),530px); margin:2px auto 4px; padding:0; border:0; background:#000; border-radius:12px; cursor:grab; touch-action:pan-y; user-select:none; }
    .heart-button.is-dragging { cursor:grabbing; }
    #heart-canvas { width:100%; height:100%; display:block; }
    .heart-prompt { color:#dda69e; }
    .heart-interaction { margin-top:13px; color:#b88480; font-size:12px; line-height:1.8; letter-spacing:.025em; }
    body[data-scene="heart"] .footer { background:linear-gradient(transparent,#000); }
    @media(max-width:600px) { #heart { padding-top:93px; } #heart .eyebrow { margin-bottom:12px; } .heart-interaction { font-size:11px; } }
    @media(max-height:650px) { #heart { padding-top:85px; } #heart h1 { font-size:clamp(2.1rem,4.8vw,3.7rem); } #heart .eyebrow { margin-bottom:12px; } }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @keyframes pulse { 50% { opacity:.45; } }
    @media(max-width:600px) { .brand { font-size:10px; letter-spacing:.09em; gap:7px; } .masthead { padding:18px 20px; } .dedication { display:none; } .footer { justify-content:center; padding:18px 20px; } .scene { padding:98px 20px 100px; } .eyebrow { font-size:10px; letter-spacing:.19em; margin-bottom:17px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition-duration:.01ms !important; scroll-behavior:auto !important; } }
    body.motion-paused *,body.motion-paused *::before,body.motion-paused *::after { animation-play-state:paused !important; }
    /* Stars and shooting stars: only visible from the envelope onward. */
    #stars { position:absolute; inset:0; }
    .star { position:absolute; width:2px; height:2px; border-radius:50%; background:#f9e5ff; opacity:.5; animation:twinkle var(--speed) ease-in-out infinite alternate; animation-delay:var(--delay); }
    .star.large { width:3px; height:3px; box-shadow:0 0 8px #e1b3ff; }
    .shooting-star { position:absolute; top:13%; left:80%; width:115px; height:1px; background:linear-gradient(90deg,transparent,#ffe7ef); transform:rotate(-35deg); opacity:0; animation:shoot 13s linear 3s infinite; }
    .shooting-star.second { top:36%; left:52%; animation-delay:9s; animation-duration:19s; }
    #particles { position:fixed; inset:0; pointer-events:none; z-index:30; overflow:hidden; }
    .burst-particle { position:absolute; width:6px; height:6px; background:var(--particle-color,var(--rose)); box-shadow:0 0 9px currentColor; border-radius:2px; animation:scatter var(--life,1.3s) var(--ease) forwards; }
    .burst-particle.heart { width:9px; height:9px; border-radius:1px; }
    .burst-particle.heart::before,.burst-particle.heart::after { content:''; position:absolute; width:100%; height:100%; border-radius:50%; background:inherit; }
    .burst-particle.heart::before { left:-50%; } .burst-particle.heart::after { top:-50%; }
    .envelope-stage { position:relative; width:min(340px,85vw); height:245px; margin:66px auto 32px; perspective:1000px; }
    .envelope-stage::before { content:''; position:absolute; inset:-45px; background:radial-gradient(ellipse,#fe683a23,transparent 68%); filter:blur(10px); }
    .envelope-button { position:relative; width:100%; height:100%; background:none; border:0; padding:0; filter:drop-shadow(0 0 28px #d8573828); }
    .envelope-back { position:absolute; inset:30px 0 0; border-radius:8px; background:#8d4436; box-shadow:0 0 0 1px #dc8a65; }
    .envelope-paper { position:absolute; top:43px; left:7%; width:86%; height:177px; padding:35px 15px; background:#fae1cd; color:#a55b56; border-radius:5px; box-shadow:0 0 15px #501b332b; transition:transform .8s .3s var(--ease); }
    .envelope-paper span { font-size:40px; }
    .envelope-paper i { display:block; width:70%; height:1px; margin:13px auto 0; background:#c28d8b50; }
    .envelope-front { position:absolute; inset:30px 0 0; border-radius:7px; background:linear-gradient(145deg,#d28766,#a95747); clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%); box-shadow:inset 0 -5px 30px #82342555; }
    .envelope-bottom { position:absolute; inset:30px 0 0; border-radius:7px; clip-path:polygon(0 100%,50% 43%,100% 100%); background:linear-gradient(0deg,#c47c5b,#e6a984); }
    .envelope-flap { position:absolute; top:30px; left:0; width:100%; height:135px; clip-path:polygon(0 0,100% 0,50% 100%); background:linear-gradient(160deg,#ecad87,#c47a5c); transform-origin:top; transition:transform .7s var(--ease); z-index:3; }
    .wax-seal { position:absolute; top:126px; left:calc(50% - 25px); width:50px; height:50px; display:grid; place-items:center; background:radial-gradient(circle at 38% 35%,#cb4d51,#832c36); border:3px double #e989735f; border-radius:47% 51% 46% 50%; color:#ffc1a7; font:28px Georgia,serif; z-index:4; box-shadow:0 3px 10px #54111d70,inset 0 0 0 3px #8b303680; transition:opacity .3s,transform .4s; }
    .envelope-stage.open .envelope-flap { transform:rotateX(180deg); z-index:0; }
    .envelope-stage.open .wax-seal { opacity:0; transform:scale(1.6); }
    .envelope-stage.open .envelope-paper { transform:translateY(-88px); }
    .envelope-label { margin:0 auto 16px; font-family:'Great Vibes',cursive; color:#e6b9ad; font-size:27px; }
    .secret-card { width:min(100%,530px); margin:auto; padding:43px 25px 36px; border:1px solid #e6adc12c; border-radius:25px; background:radial-gradient(ellipse at top,#a4639130,transparent 70%),linear-gradient(145deg,#26172aca,#160e21cf); box-shadow:0 25px 100px #0004,inset 0 1px 0 #f8cadd12; }
    .secret-card .eyebrow { font-size:29px; margin-bottom:25px; }
    .secret-card h2 { font-size:clamp(2.8rem,6vw,4rem); }
    .secret-divider { display:flex; align-items:center; gap:20px; margin:28px auto; max-width:235px; color:var(--rose); }
    .secret-divider::before,.secret-divider::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,transparent,#d29abf60); }
    .secret-divider::after { transform:rotate(180deg); }
    .secret-lead { font-size:14px; color:#cdb4cf; }
    .secret-message { font-size:24px; line-height:1.65; margin:10px auto 20px; max-width:310px; color:#ffe1e7; }
    .secret-foot { font-size:13px; color:#bea6c3; line-height:1.7; }
    #butterflies h2 { font-size:clamp(2.7rem,5vw,4.4rem); }
    .game-content { width:min(100%,680px); }
    .message-card { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:171px; margin:23px auto 0; padding:18px 22px; max-width:570px; border:1px solid transparent; border-radius:18px; transition:background .5s,border-color .5s; }
    .message-card.has-message { border-color:#e3b6ef26; background:#a274bc0e; }
    .message-tanglish { line-height:1.65; color:#f2d9f0; font-size:17px; }
    .message-english { line-height:1.7; color:var(--muted); font-size:14px; margin-top:7px; }
    .message-card .text-button { padding:8px 16px; font-size:12px; margin-top:6px; }
    .butterfly-field { position:relative; height:240px; width:100%; margin:5px auto 0; }
    .butterfly { position:absolute; left:var(--x); top:var(--y); width:65px; height:65px; border:0; background:none; padding:4px; margin:-32px 0 0 -32px; color:var(--wing); filter:drop-shadow(0 0 11px currentColor); animation:wander var(--flight) ease-in-out infinite; animation-delay:var(--offset); transition:opacity .3s; }
    .butterfly:hover { filter:drop-shadow(0 0 19px currentColor); }
    .butterfly svg { width:100%; height:100%; overflow:visible; animation:flutter .7s ease-in-out infinite alternate; }
    .butterfly.caught { visibility:hidden; pointer-events:none; }
    .butterfly-traveler { position:fixed; z-index:31; width:55px; height:55px; pointer-events:none; color:var(--wing); filter:drop-shadow(0 0 12px currentColor); }
    .jar-wrap { position:relative; width:130px; height:146px; margin:-5px auto 0; }
    .jar { position:absolute; top:24px; left:14px; width:102px; height:112px; border:1px solid #ecd8fd88; border-top:0; border-radius:11px 11px 24px 24px; background:linear-gradient(105deg,#e1c8ff20,#d9c1ff04 30%,#e1c8ff10 70%,#eee4ff25); box-shadow:inset 4px 0 7px #fff1,0 0 30px #b58bd90d; transition:box-shadow 1s,background 1s; }
    .jar::before { content:''; position:absolute; left:8px; top:14px; bottom:15px; width:4px; border-radius:100px; background:#fff3; }
    .jar::after { content:''; position:absolute; left:15px; right:15px; height:8px; border:1px solid #e4cfff26; border-radius:50%; bottom:6px; }

    /* ---------------------------------------------------------------
